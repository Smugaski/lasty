[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project]
name = "lasty"
version = "0.1.2"
description = "A fully typed, async Python wrapper for the Last.fm API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["lastfm", "last.fm", "api", "async", "aiohttp", "music", "scrobble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/Smugaski/lasty"
Documentation = "https://github.com/Smugaski/lasty#readme"
Repository = "https://github.com/Smugaski/lasty"
Issues = "https://github.com/Smugaski/lasty/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]
